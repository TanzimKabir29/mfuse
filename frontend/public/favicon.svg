<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#f4530f"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b6f76"/>
      <stop offset="100%" stop-color="#2e3136"/>
    </linearGradient>
  </defs>

  <g transform="translate(100 100) rotate(-38)">
    <!-- glass tube -->
    <rect x="-68" y="-26" width="136" height="52" rx="26" fill="url(#glass)" stroke="#0d0d0f" stroke-width="4.5"/>

    <!-- crack / filament across the middle, sharpened into an M -->
    <path d="M -48 6 L -24 -15 L 0 3 L 24 -15 L 48 6" fill="none" stroke="#0d0d0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.6"/>

    <!-- glass shine -->
    <path d="M -50 -14 Q 0 -26 50 -14" fill="none" stroke="#ffe8b3" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

    <!-- left cap -->
    <rect x="-96" y="-32" width="46" height="64" rx="12" fill="url(#cap)" stroke="#0d0d0f" stroke-width="4.5"/>
    <rect x="-88" y="-24" width="6" height="48" rx="3" fill="#9a9ea5" opacity="0.6"/>

    <!-- right cap -->
    <rect x="50" y="-32" width="46" height="64" rx="12" fill="url(#cap)" stroke="#0d0d0f" stroke-width="4.5"/>
    <rect x="82" y="-24" width="6" height="48" rx="3" fill="#9a9ea5" opacity="0.6"/>
  </g>
</svg>
