<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="glass-spent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9ea5"/>
      <stop offset="100%" stop-color="#55575c"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b6f76"/>
      <stop offset="100%" stop-color="#2e3136"/>
    </linearGradient>
  </defs>

  <g transform="translate(100 100) rotate(-38)">
    <!-- left half of the tube, now spent (no more glow) -->
    <rect x="-68" y="-26" width="55" height="52" rx="20" fill="url(#glass-spent)" stroke="#0d0d0f" stroke-width="4.5"/>
    <path d="M -50 -14 Q -25 -22 -15 -18" fill="none" stroke="#d4d6d9" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- right half of the tube -->
    <rect x="13" y="-26" width="55" height="52" rx="20" fill="url(#glass-spent)" stroke="#0d0d0f" stroke-width="4.5"/>
    <path d="M 15 -18 Q 25 -22 50 -14" fill="none" stroke="#d4d6d9" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- torn/burnt edge marks at the break -->
    <path d="M -17 -14 L -10 -4 L -16 6 L -9 16" fill="none" stroke="#0d0d0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.7"/>
    <path d="M 17 -14 L 10 -4 L 16 6 L 9 16" fill="none" stroke="#0d0d0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.7"/>

    <!-- a last wisp of smoke drifting off the break -->
    <path d="M -2 -12 Q 4 -22 -3 -30 Q -9 -37 -1 -44" fill="none" stroke="#c3c5ca" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- a couple of stray sparks, scattered rather than symmetric -->
    <path d="M -12 10 L -7 15" stroke="#ff5a1f" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 6 -6 L 11 -9" stroke="#ff5a1f" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="-6" cy="17" r="1.8" fill="#ff5a1f" opacity="0.75"/>

    <!-- left cap -->
    <rect x="-96" y="-32" width="46" height="64" rx="12" fill="url(#cap)" stroke="#0d0d0f" stroke-width="4.5"/>
    <rect x="-88" y="-24" width="6" height="48" rx="3" fill="#9a9ea5" opacity="0.6"/>

    <!-- right cap -->
    <rect x="50" y="-32" width="46" height="64" rx="12" fill="url(#cap)" stroke="#0d0d0f" stroke-width="4.5"/>
    <rect x="82" y="-24" width="6" height="48" rx="3" fill="#9a9ea5" opacity="0.6"/>
  </g>
</svg>
