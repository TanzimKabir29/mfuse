name: mfuse

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mfuse
      POSTGRES_PASSWORD: mfuse_dev_password
      POSTGRES_DB: mfuse
    ports:
      - "9002:5432"
    volumes:
      - mfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfuse -d mfuse"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://mfuse:mfuse_dev_password@postgres:5432/mfuse
    ports:
      - "9001:9001"

volumes:
  mfuse_pgdata:
